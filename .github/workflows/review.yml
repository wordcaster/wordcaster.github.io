# review.yml: the page's own gate. Four real checks run against every push
# to main, then manifest.json records exactly what ran and how it went, and
# the page renders that file. A check name the manifest shows is a check
# that executed; there is no other way in.
#
# Loop prevention, two independent brakes:
#   1. paths-ignore: the manifest commit touches only manifest.json, which
#      this trigger ignores, so that push cannot start another run.
#   2. the manifest commit message carries [skip ci], which GitHub honors
#      for push events even if the paths filter ever changes.
#
# Actions are pinned by commit SHA. On this site, "trust the tag" would be
# a joke at the page's expense.
name: review index.html

on:
  push:
    branches: [main]
    paths-ignore:
      - manifest.json

permissions:
  contents: write

concurrency:
  group: review-main
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Tool acquisition is separate from the check so a registry or network
      # failure skips the check instead of recording a "fail" for a check
      # that never ran. A skipped check is omitted from the manifest and
      # still turns the run red at the gate step.
      - name: Install html-validate
        id: html_setup
        continue-on-error: true
        run: npm install --no-save --ignore-scripts html-validate@11.5.6

      - name: 'Check 1: HTML validation'
        id: html
        if: steps.html_setup.outcome == 'success'
        continue-on-error: true
        run: npx --no-install html-validate index.html

      - name: 'Check 2: links resolve'
        id: links
        continue-on-error: true
        run: node tools/check-links.mjs

      - name: 'Check 3: prose lint on visible copy'
        id: prose
        continue-on-error: true
        run: node tools/prose-lint.mjs

      - name: 'Check 4: cards match projects.json'
        id: cards
        continue-on-error: true
        run: node tools/render-cards.mjs --check

      - name: Write the manifest from what actually ran
        env:
          CHECK_HTML_VALIDATE: ${{ steps.html.outcome }}
          CHECK_LINK_CHECK: ${{ steps.links.outcome }}
          CHECK_PROSE_LINT: ${{ steps.prose.outcome }}
          CHECK_CARDS: ${{ steps.cards.outcome }}
        run: node tools/write-manifest.mjs

      # Only the run whose commit is still main's tip lands its manifest;
      # if main moved on, the newer run records its own and this one steps
      # aside. That keeps every manifest commit's parent equal to the sha
      # the manifest describes, and makes rebase conflicts impossible.
      - name: Commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "manifest: record checks for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "main moved past ${GITHUB_SHA::7}; the newer push's run owns the manifest now"
              exit 0
            fi
            if git push origin HEAD:main; then
              echo "manifest committed for ${GITHUB_SHA::7}"
              exit 0
            fi
            sleep 3
          done
          echo "could not push the manifest after 3 attempts"
          exit 1

      - name: Fail the run unless every check ran and passed
        env:
          CHECK_HTML_VALIDATE: ${{ steps.html.outcome }}
          CHECK_LINK_CHECK: ${{ steps.links.outcome }}
          CHECK_PROSE_LINT: ${{ steps.prose.outcome }}
          CHECK_CARDS: ${{ steps.cards.outcome }}
        run: |
          bad=0
          for outcome in "$CHECK_HTML_VALIDATE" "$CHECK_LINK_CHECK" "$CHECK_PROSE_LINT" "$CHECK_CARDS"; do
            if [ "$outcome" != "success" ]; then bad=1; fi
          done
          if [ "$bad" = "1" ]; then
            echo "a check failed or never ran; the manifest records exactly what did"
            exit 1
          fi
